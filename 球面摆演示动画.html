<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>球面摆模拟 · 轨迹对比</title>
<style>
  :root{
    --ink:#0f3a3d;
    --muted:#5b7c83;
    --teal:#0ea79a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    overflow:hidden;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 700px at 78% 6%, #ffffff 0%, rgba(255,255,255,0) 62%),
      radial-gradient(800px 800px at 8% 92%, #e6f4f5 0%, rgba(230,244,245,0) 60%),
      linear-gradient(155deg,#f9fcfd 0%,#e9f2f4 100%);
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 返回首页按钮 ===== */
  .back-home{
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 999;
    display: inline-block;
    padding: 7px 14px;
    background: #2A9D8F;
    color: #ffffff;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(42, 157, 143, .28);
    transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .back-home:hover{
    background: #0E6B6B;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(42, 157, 143, .36);
  }

  #stage{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    cursor:grab;
  }
  #stage:active{ cursor:grabbing; }

  /* ---------- 控制面板 ---------- */
  .panel{
    position:fixed;
    top:74px;
    left:18px;
    width:296px;
    max-height:calc(100vh - 92px);
    overflow-y:auto;
    z-index:1;
    padding:16px 16px 14px;
    border-radius:18px;
    background:rgba(255,255,255,.76);
    -webkit-backdrop-filter:blur(16px) saturate(1.5);
    backdrop-filter:blur(16px) saturate(1.5);
    border:1px solid rgba(14,167,154,.18);
    box-shadow:
      0 18px 40px -22px rgba(6,52,60,.38),
      0 3px 10px -6px rgba(6,52,60,.16);
    scrollbar-width:thin;
  }
  .panel::-webkit-scrollbar{ width:6px; }
  .panel::-webkit-scrollbar-thumb{ background:rgba(14,167,154,.3); border-radius:99px; }

  .panel header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .panel h1{
    font-size:15px;
    font-weight:700;
    letter-spacing:.05em;
    margin:0;
    color:#0a4747;
  }
  .tag{
    font-size:10px;
    letter-spacing:.08em;
    padding:2px 7px;
    border-radius:99px;
    color:#0d8a80;
    background:rgba(20,184,166,.12);
    border:1px solid rgba(20,184,166,.25);
  }
  .hint{
    margin:0 0 12px;
    font-size:11px;
    line-height:1.6;
    color:var(--muted);
  }

  .row{
    display:grid;
    grid-template-columns:34px 1fr 52px;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .row label{
    font-size:12px;
    color:#47707a;
    letter-spacing:.02em;
  }
  .row .val{
    font-size:11px;
    text-align:right;
    color:#0d8f83;
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
  }

  input[type=range]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:18px;
    background:transparent;
    cursor:pointer;
    outline:none;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px; border-radius:99px;
    background:linear-gradient(90deg,#cfe8ea,#dcecee);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:14px; margin-top:-5px;
    border-radius:50%;
    background:#0fa89b;
    border:2px solid #fff;
    box-shadow:0 1px 5px rgba(10,110,102,.45);
    transition:transform .12s ease;
  }
  input[type=range]:active::-webkit-slider-thumb{ transform:scale(1.18); }
  input[type=range]::-moz-range-track{
    height:4px; border-radius:99px; background:#dcecee;
  }
  input[type=range]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%;
    background:#0fa89b; border:2px solid #fff;
    box-shadow:0 1px 5px rgba(10,110,102,.45);
  }

  .btns{
    display:flex;
    gap:7px;
    margin-top:13px;
  }
  button{
    flex:1;
    padding:8px 4px;
    font-size:12px;
    font-family:inherit;
    font-weight:600;
    letter-spacing:.03em;
    border-radius:10px;
    cursor:pointer;
    color:#0c6b64;
    border:1px solid rgba(14,167,154,.3);
    background:linear-gradient(180deg,#ffffff,#eef8f8);
    transition:background .16s, border-color .16s, transform .08s, box-shadow .16s;
    white-space:nowrap;
  }
  button:hover{
    background:linear-gradient(180deg,#f1fbfa,#ddf3f1);
    border-color:rgba(14,167,154,.6);
    box-shadow:0 4px 12px -8px rgba(10,110,102,.8);
  }
  button:active{ transform:translateY(1px); }
  button.primary{
    color:#fff;
    border-color:#0b8377;
    background:linear-gradient(180deg,#13b8a8,#0d9488);
    box-shadow:0 6px 16px -10px rgba(13,148,136,.9);
  }
  button.primary:hover{
    background:linear-gradient(180deg,#17c6b5,#0e9e91);
  }

  .legend{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:13px;
    padding-top:11px;
    border-top:1px dashed rgba(14,167,154,.3);
    font-size:11.5px;
    color:var(--muted);
  }
  .legend span{ display:flex; align-items:center; gap:8px; }
  .line{
    width:20px; height:3px; border-radius:99px;
    display:inline-block; flex:0 0 auto;
  }
  .line.cur{ background:#0ea79a; box-shadow:0 0 6px rgba(14,167,154,.6); }
  .line.prev{ background:rgba(99,102,241,.34); }

  .tip{
    position:fixed;
    right:18px; bottom:16px;
    font-size:11px;
    letter-spacing:.04em;
    color:rgba(70,110,118,.72);
    background:rgba(255,255,255,.6);
    padding:5px 11px;
    border-radius:99px;
    border:1px solid rgba(14,167,154,.14);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    pointer-events:none;
  }

  @media (max-width:780px){
    .panel{
      top:62px;
      left:10px; right:10px;
      width:auto;
      max-height:42vh;
      padding:13px 13px 11px;
    }
    .back-home{
      top:12px; left:12px;
      padding:6px 12px;
      font-size:13px;
    }
    .row{ grid-template-columns:30px 1fr 48px; margin-bottom:4px; }
    .tip{ display:none; }
  }
</style>
</head>
<body>

<a class="back-home" href="index.html"> ← 返回</a>

<canvas id="stage"></canvas>

<aside class="panel">
  <header>
    <h1>球面摆模拟</h1>
    <span class="tag">轨迹对比</span>
  </header>
  <p class="hint">拖动滑块微调初始状态，松手即重新演算；当前轨迹会自动存档为「上一条」用于对比。拖动画面可旋转视角。</p>

  <div id="controls"></div>

  <div class="btns">
    <button id="btnRestart" class="primary">重新开始</button>
    <button id="btnPause">暂停</button>
    <button id="btnClear">清除对比</button>
  </div>

  <div class="legend">
    <span><i class="line cur"></i>最新轨迹</span>
    <span><i class="line prev"></i>上一条轨迹（半透明）</span>
  </div>
</aside>

<div class="tip">拖拽旋转视角 · 空格暂停 · R 重开</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     基础
  ============================================================ */
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  const DEG = Math.PI / 180;
  const CUR_COLOR  = '#0ea79a';   // 最新轨迹：青绿
  const PREV_COLOR = '#6366f1';   // 上一条轨迹：靛蓝 + 半透明
  const MAX_POINTS = 4200;
  const DT = 1 / 1000;            // 物理积分步长

  let W = 0, H = 0, DPR = 1;
  let cx = 0, cy = 0, scale = 120, camDist = 4.2;
  let yaw = 0.75, pitch = 0.42;

  /* ============================================================
     参数与控件定义
  ============================================================ */
  const P = { g: 9.81 };

  const CONTROLS = [
    { key:'th0',   label:'θ₀',  min:0,   max:180, step:0.5,  value:70,  fmt:v=>v.toFixed(1)+'°' },
    { key:'ph0',   label:'φ₀',  min:0,   max:360, step:1,    value:0,   fmt:v=>v.toFixed(0)+'°' },
    { key:'wth',   label:'ωθ',  min:-4,  max:4,   step:0.05, value:0.5, fmt:v=>v.toFixed(2) },
    { key:'wph',   label:'ωφ',  min:-4,  max:4,   step:0.05, value:1.5, fmt:v=>v.toFixed(2) },
    { key:'L',     label:'L',   min:0.4, max:1.6, step:0.01, value:1,   fmt:v=>v.toFixed(2)+'m' },
    { key:'speed', label:'速度', min:0.1, max:2.5, step:0.05, value:1,  fmt:v=>v.toFixed(2)+'×' },
  ];
  CONTROLS.forEach(c => { P[c.key] = c.value; });

  /* ============================================================
     状态
  ============================================================ */
  // 状态向量：[ux, uy, uz, vx, vy, vz]   (u 为单位方向，v 为 u 的导数)
  let state = [0, -1, 0, 0, 0, 0];
  let current  = [];   // 当前轨迹（存单位方向，渲染时乘 L）
  let previous = [];   // 上一条轨迹
  let acc = 0;
  let stepCount = 0;
  let running = true;
  let scrubLock = false;
  let last = performance.now();

  /* ============================================================
     物理：球面摆（笛卡尔形式，无奇点）
     ü = g⃗/L - ( g⃗·u/L + |u̇|² ) u
  ============================================================ */
  const k1 = new Float64Array(6), k2 = new Float64Array(6),
        k3 = new Float64Array(6), k4 = new Float64Array(6),
        tmp = new Float64Array(6);

  function derivs(s, out) {
    const ux = s[0], uy = s[1], uz = s[2];
    const vx = s[3], vy = s[4], vz = s[5];
    const v2 = vx*vx + vy*vy + vz*vz;
    const k  = (-P.g * uy) / P.L + v2;

    out[0] = vx;  out[1] = vy;  out[2] = vz;
    out[3] = -k * ux;
    out[4] = -P.g / P.L - k * uy;
    out[5] = -k * uz;
  }

  function normalize(s) {
    const n = Math.hypot(s[0], s[1], s[2]) || 1;
    s[0] /= n; s[1] /= n; s[2] /= n;
    const d = s[0]*s[3] + s[1]*s[4] + s[2]*s[5];
    s[3] -= d * s[0];
    s[4] -= d * s[1];
    s[5] -= d * s[2];
  }

  function rk4(h) {
    const s = state;
    derivs(s, k1);
    for (let i = 0; i < 6; i++) tmp[i] = s[i] + 0.5*h*k1[i];
    derivs(tmp, k2);
    for (let i = 0; i < 6; i++) tmp[i] = s[i] + 0.5*h*k2[i];
    derivs(tmp, k3);
    for (let i = 0; i < 6; i++) tmp[i] = s[i] + h*k3[i];
    derivs(tmp, k4);
    for (let i = 0; i < 6; i++) {
      s[i] += h / 6 * (k1[i] + 2*k2[i] + 2*k3[i] + k4[i]);
    }
    normalize(s);
  }

  /* ============================================================
     初始条件
     θ 自竖直向下方向量起，φ 为绕竖直轴的方位角
     u   = ( sinθcosφ , -cosθ , sinθsinφ )
     u̇   = θ̇ ∂u/∂θ + φ̇ ∂u/∂φ
  ============================================================ */
  function initState() {
    const th = P.th0 * DEG;
    const ph = P.ph0 * DEG;
    const st = Math.sin(th), ct = Math.cos(th);
    const sp = Math.sin(ph), cp = Math.cos(ph);

    const ux = st * cp, uy = -ct, uz = st * sp;

    const tx = ct * cp, ty = st,    tz = ct * sp;   // ∂u/∂θ
    const px = -st*sp,  py = 0,     pz = st * cp;   // ∂u/∂φ

    return [
      ux, uy, uz,
      P.wth*tx + P.wph*px,
      P.wth*ty + P.wph*py,
      P.wth*tz + P.wph*pz
    ];
  }

  /* ============================================================
     轨迹记录 / 存档
  ============================================================ */
  function record() {
    const ux = state[0], uy = state[1], uz = state[2];
    const p = current[current.length - 1];
    if (p) {
      const dx = ux - p.x, dy = uy - p.y, dz = uz - p.z;
      if (dx*dx + dy*dy + dz*dz < 2.5e-6) return;   // ≈0.0016 的弧长间隔
    }
    current.push({ x: ux, y: uy, z: uz });
    if (current.length > MAX_POINTS) {
      current.splice(0, current.length - MAX_POINTS);
    }
  }

  function archive() {
    if (current.length > 20) previous = current;
  }

  function resetSim() {
    state = initState();
    normalize(state);
    current = [];
    acc = 0;
    stepCount = 0;
    record();
  }

  /* ============================================================
     视图
  ============================================================ */
  function updateView() {
    const wide = W > 780;
    const panelW = wide ? 340 : 0;
    const availW = W - panelW;
    cx = panelW + availW * 0.5;
    cy = wide ? H * 0.5 : H * 0.58;
    scale = Math.min(availW, H) * 0.30 / P.L;
    camDist = 4.2 * P.L;
  }

  /* ============================================================
     轨迹绘制
  ============================================================ */
  let _sx = new Float32Array(0);
  let _sy = new Float32Array(0);

  function ensureBuffers(n) {
    if (_sx.length < n) {
      _sx = new Float32Array(n);
      _sy = new Float32Array(n);
    }
  }

  function drawTrail(pts, color, baseAlpha, width, floor, glow) {
    const n = pts.length;
    if (n < 2) return;
    ensureBuffers(n);

    const cY = Math.cos(yaw),  sY = Math.sin(yaw);
    const cP = Math.cos(pitch), sP = Math.sin(pitch);

    for (let i = 0; i < n; i++) {
      const p = pts[i];
      const px = p.x * P.L, py = p.y * P.L, pz = p.z * P.L;
      const rx =  px * cY + pz * sY;
      const rz = -px * sY + pz * cY;
      const fy = py * cP - rz * sP;
      const fz = py * sP + rz * cP;
      const persp = camDist / (camDist - fz);
      _sx[i] = cx + rx * persp * scale;
      _sy[i] = cy - fy * persp * scale;
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = color;

    /* 柔光底衬 */
    if (glow) {
      ctx.globalAlpha = baseAlpha * 0.10;
      ctx.lineWidth = width * 4.5;
      ctx.beginPath();
      ctx.moveTo(_sx[0], _sy[0]);
      for (let i = 1; i < n; i++) ctx.lineTo(_sx[i], _sy[i]);
      ctx.stroke();
    }

    /* 分段渐隐描边：越旧的线段越淡 */
    const CHUNK = 56;
    ctx.lineWidth = width;
    for (let i = 0; i < n - 1; i += CHUNK) {
      const end = Math.min(i + CHUNK, n - 1);
      const t = (i + end) * 0.5 / (n - 1);
      ctx.globalAlpha = baseAlpha * (floor + (1 - floor) * t);

      ctx.beginPath();
      ctx.moveTo(_sx[i], _sy[i]);
      for (let j = i + 1; j <= end; j++) ctx.lineTo(_sx[j], _sy[j]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     球面参考线
  ============================================================ */
  function drawSphereGuide() {
    const cY = Math.cos(yaw),  sY = Math.sin(yaw);
    const cP = Math.cos(pitch), sP = Math.sin(pitch);

    const R = scale * P.L * camDist / Math.sqrt(camDist * camDist - P.L * P.L);

    /* 球体柔光 */
    const sg = ctx.createRadialGradient(cx - R*0.3, cy - R*0.35, R*0.05, cx, cy, R);
    sg.addColorStop(0, 'rgba(255,255,255,0.55)');
    sg.addColorStop(1, 'rgba(222,242,243,0.10)');
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = sg;
    ctx.fill();

    /* 轮廓虚线 */
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(14,167,154,0.16)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.restore();

    /* 赤道环（y = 0 平面） */
    const N = 80;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const a = i / N * Math.PI * 2;
      const px = Math.cos(a) * P.L;
      const pz = Math.sin(a) * P.L;
      const rx =  px * cY + pz * sY;
      const rz = -px * sY + pz * cY;
      const fy = -rz * sP;
      const fz =  rz * cP;
      const persp = camDist / (camDist - fz);
      const X = cx + rx * persp * scale;
      const Y = cy - fy * persp * scale;
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.strokeStyle = 'rgba(14,167,154,0.13)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  /* ============================================================
     摆体绘制
  ============================================================ */
  function drawPendulum() {
    const cY = Math.cos(yaw),  sY = Math.sin(yaw);
    const cP = Math.cos(pitch), sP = Math.sin(pitch);

    function proj(x, y, z) {
      const rx =  x * cY + z * sY;
      const rz = -x * sY + z * cY;
      const fy = y * cP - rz * sP;
      const fz = y * sP + rz * cP;
      const persp = camDist / (camDist - fz);
      return [cx + rx * persp * scale, cy - fy * persp * scale];
    }

    const [ox, oy] = proj(0, 0, 0);
    const [bx, by] = proj(state[0]*P.L, state[1]*P.L, state[2]*P.L);

    /* 支点柔光 */
    const halo = ctx.createRadialGradient(ox, oy, 0, ox, oy, 26);
    halo.addColorStop(0, 'rgba(20,184,166,.22)');
    halo.addColorStop(1, 'rgba(20,184,166,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(ox, oy, 26, 0, Math.PI * 2);
    ctx.fill();

    /* 摆杆 */
    ctx.strokeStyle = 'rgba(11,92,88,.55)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(bx, by);
    ctx.stroke();

    /* 支点 */
    ctx.beginPath();
    ctx.arc(ox, oy, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = '#0f766e';
    ctx.fill();
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.stroke();

    /* 摆球 */
    const r = 11;
    const g = ctx.createRadialGradient(bx - r*0.35, by - r*0.42, r*0.12, bx, by, r*1.05);
    g.addColorStop(0, '#d6fdf7');
    g.addColorStop(0.45, '#2dd4bf');
    g.addColorStop(1, '#0b7f74');
    ctx.beginPath();
    ctx.arc(bx, by, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.stroke();
  }

  /* ============================================================
     渲染
  ============================================================ */
  function render() {
    ctx.clearRect(0, 0, W, H);
    updateView();

    drawSphereGuide();

    if (previous.length > 1) {
      drawTrail(previous, PREV_COLOR, 0.34, 1.7, 0.30, false);
    }
    if (current.length > 1) {
      drawTrail(current, CUR_COLOR, 0.95, 2.0, 0.10, true);
    }

    drawPendulum();
  }

  /* ============================================================
     主循环
  ============================================================ */
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.08) dt = 0.08;

    if (running) {
      acc += dt * P.speed;
      let guard = 0;
      while (acc >= DT && guard++ < 900) {
        rk4(DT);
        acc -= DT;
        stepCount++;
        if (stepCount % 6 === 0) record();
      }
      if (acc > 0.2) acc = 0;
    }

    render();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     尺寸
  ============================================================ */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    updateView();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  /* ============================================================
     拖拽旋转视角
  ============================================================ */
  let dragging = false, lastX = 0, lastY = 0;

  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });

  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    yaw += dx * 0.008;
    pitch += dy * 0.006;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
  });

  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', endDrag);

  /* ============================================================
     UI 构建
  ============================================================ */
  const controlsEl = document.getElementById('controls');

  CONTROLS.forEach(c => {
    const row = document.createElement('div');
    row.className = 'row';

    const label = document.createElement('label');
    label.textContent = c.label;

    const input = document.createElement('input');
    input.type = 'range';
    input.min = c.min;
    input.max = c.max;
    input.step = c.step;
    input.value = c.value;

    const val = document.createElement('span');
    val.className = 'val';
    val.textContent = c.fmt(c.value);

    input.addEventListener('input', () => {
      if (!scrubLock) { scrubLock = true; archive(); }
      const v = parseFloat(input.value);
      P[c.key] = v;
      val.textContent = c.fmt(v);
      if (c.key !== 'speed') resetSim();
    });

    const unlock = () => { scrubLock = false; };
    input.addEventListener('change', unlock);
    input.addEventListener('pointerup', unlock);
    input.addEventListener('blur', unlock);

    row.appendChild(label);
    row.appendChild(input);
    row.appendChild(val);
    controlsEl.appendChild(row);
  });

  /* ============================================================
     按钮
  ============================================================ */
  const btnRestart = document.getElementById('btnRestart');
  const btnPause   = document.getElementById('btnPause');
  const btnClear   = document.getElementById('btnClear');

  btnRestart.addEventListener('click', () => {
    archive();
    resetSim();
    if (!running) {
      running = true;
      btnPause.textContent = '暂停';
    }
    last = performance.now();
  });

  btnPause.addEventListener('click', () => {
    running = !running;
    btnPause.textContent = running ? '暂停' : '继续';
    last = performance.now();
  });

  btnClear.addEventListener('click', () => {
    previous = [];
  });

  window.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input') return;
    if (e.code === 'Space') {
      e.preventDefault();
      btnPause.click();
    } else if (e.key === 'r' || e.key === 'R') {
      btnRestart.click();
    }
  });

  /* ============================================================
     启动
  ============================================================ */
  resize();
  resetSim();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
