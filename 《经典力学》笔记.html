**力学**是研究物体机械运动规律的科学。描述任何运动之前，必须先明确两件事：**参考系**与**坐标系**。

#### 一、参考系与坐标系

- **参考系**：被选作参考标准的物体（或物体群）。运动与静止都是相对的，脱离参考系谈运动没有意义。
- **坐标系**：参考系的数学化表示，常用直角坐标系、自然坐标系、极坐标系。
- 同一运动在不同参考系中形式不同：地面系中雨滴竖直下落，车厢系中雨滴向后倾斜。

#### 二、质点模型

当物体的**形状与大小**对研究的问题影响可忽略时，可把它抽象为一个具有质量的几何点，称为**质点**。

> 判据：物体各点运动状态差别可忽略，或物体线度远小于运动的空间尺度。

#### 三、位矢与运动方程

设质点在直角坐标系中的位置矢量为 $\vec{r}$，则

$$
\vec{r}=x\vec{i}+y\vec{j}+z\vec{k}
$$

其大小为 $r=\left|\vec{r}\right|=\sqrt{x^2+y^2+z^2}$，方向余弦为

$$
\cos\alpha=\frac{x}{r},\qquad \cos\beta=\frac{y}{r},\qquad \cos\gamma=\frac{z}{r}
$$

若把坐标表示成时间的函数 $x=x(t),\ y=y(t),\ z=z(t)$，这组方程就称为**运动方程**，它完整地描述了质点的运动。

- 已知运动方程，可以求出轨迹方程（消去 $t$）；
- 反之，仅知轨迹只能得到运动路径，得不到运动快慢。

**位移**是矢量，只由初末位置决定；**路程**是标量，与路径有关。

$$
\Delta\vec{r}=\vec{r}(t+\Delta t)-\vec{r}(t)
$$

一般来说 $\left|\Delta\vec{r}\right|\le\Delta s$，只有在 $\Delta t\to 0$ 的极限下二者微元相等：$\left|d\vec{r}\right|=ds$。

#### 二、速度

| 物理量 | 定义式 | 说明 |
| --- | --- | --- |
| 平均速度 | $\bar{\vec{v}}=\dfrac{\Delta\vec{r}}{\Delta t}$ | 矢量，方向同位移 |
| 瞬时速度 | $\vec{v}=\dfrac{d\vec{r}}{dt}$ | 方向沿轨迹切线 |
| 平均速率 | $\bar{v}=\dfrac{\Delta s}{\Delta t}$ | 标量 |
| 瞬时速率 | $v=\dfrac{ds}{dt}=\left|\vec{v}\right|$ | 标量 |

#### 三、加速度

$$
\vec{a}=\frac{d\vec{v}}{dt}=\frac{d^2\vec{r}}{dt^2}
$$

在**自然坐标系**中按切向与法向分解：

$$
\vec{a}=\underbrace{\frac{dv}{dt}\vec{e}_t}_{\text{切向加速度}}+\underbrace{\frac{v^2}{\rho}\vec{e}_n}_{\text{法向加速度}}
$$

- 切向分量 $a_t=\dfrac{dv}{dt}$ 只改变**速度大小**；
- 法向分量 $a_n=\dfrac{v^2}{\rho}$ 只改变**速度方向**，$\rho$ 为该点曲率半径。

> 匀速圆周运动是 $a_t=0$、$a_n=\frac{v^2}{R}$ 的典型情形；直线运动则是 $a_n=0$。

#### 一、运动学两类基本问题

1. **第一类**：已知运动方程 $\vec{r}=\vec{r}(t)$，通过求导得速度与加速度。
2. **第二类**：已知加速度 $\vec{a}=\vec{a}(t)$ 和初始条件，通过积分得 $\vec{v}(t)$ 与 $\vec{r}(t)$。

$$
\vec{v}=\vec{v}_0+\int_0^t \vec{a}\,\mathrm{d}t,\qquad
\vec{r}=\vec{r}_0+\int_0^t \vec{v}\,\mathrm{d}t
$$

#### 二、匀变速直线运动

$$
v=v_0+at,\qquad x=x_0+v_0t+\tfrac{1}{2}at^2,\qquad v^2-v_0^2=2a(x-x_0)
$$

#### 三、抛体运动

以初速度 $v_0$、抛射角 $\theta$ 斜抛，取抛出点为原点：

$$
\begin{cases}
x=v_0\cos\theta\cdot t\\[4pt]
y=v_0\sin\theta\cdot t-\dfrac{1}{2}gt^2
\end{cases}
$$

消去 $t$ 得轨迹方程 $y=x\tan\theta-\dfrac{gx^2}{2v_0^2\cos^2\theta}$，为一条抛物线。射程与射高分别为

$$
R=\frac{v_0^2\sin 2\theta}{g},\qquad H=\frac{v_0^2\sin^2\theta}{2g}
$$

- 匀角加速转动：$\omega=\omega_0+\beta t$，$\theta=\omega_0t+\frac{1}{2}\beta t^2$。

> 记忆要点：**平动的公式把 $x\to\theta$、$v\to\omega$、$a\to\beta$ 逐一代换，就得到转动公式。**

\end{cases}

定义动量 $\vec{p}=m\vec{v}$，冲量 $\vec{I}=\displaystyle\int_{t_1}^{t_2}\vec{F}\,\mathrm{d}t$，则

$$
\vec{I}=\int_{t_1}^{t_2}\vec{F}\,\mathrm{d}t=\vec{p}_2-\vec{p}_1
$$

即**合外力的冲量等于动量的增量**。平均力可写为

$$
\bar{F}=\frac{\vec{p}_2-\vec{p}_1}{t_2-t_1}
$$

当系统所受**合外力为零**时，

$$
\sum_i m_i\vec{v}_i=\text{常量}
$$

即

$$
m_1\vec{v}_1+m_2\vec{v}_2=m_1\vec{v}_1'+m_2\vec{v}_2'
$$

$$

功是**标量**，有正负：$\theta<90^\circ$ 做正功，$\theta=90^\circ$ 不做功，$\theta>90^\circ$ 做负功。

$$

系统内只有**保守力做功**时，机械能守恒：

E_k+E_p=\text{常量}

  border-radius:0 6px 6px 0;
  transition:background .15s, color .15s, border-color .15s;
}
.toc-sec-link:hover{
  background:var(--pale);
  border-left-color:var(--main-dark);
  color:var(--deep);
}
.toc-sec-link.active{
  background:var(--pale-2);
  border-left-color:var(--deep);
  color:var(--deep);
  font-weight:bold;
}
#toc-empty{
  display:none;
  padding:18px 12px; font-size:13.5px; color:var(--muted); text-align:center;
}

/* ---------- 移动端顶栏 / 遮罩 ---------- */
#topbar{
  display:none;
  position:sticky; top:0; z-index:45;
  align-items:center; gap:12px;
  height:52px; padding:0 14px;
  background:rgba(232,244,243,.94);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
#menuBtn{
  font-family:inherit; font-size:14px; color:var(--deep);
  background:#fff; border:1px solid var(--line);
  border-radius:6px; padding:5px 12px; cursor:pointer;
}
#menuBtn:hover{ background:var(--pale-2); }
#topbar-title{
  font-size:15px; font-weight:bold; color:var(--deep);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#overlay{
  display:none;
  position:fixed; inset:0; background:rgba(22,48,46,.32); z-index:48;
}
#overlay.show{ display:block; }

/* ---------- 右侧正文 ---------- */
main{ margin-left:var(--side-w); min-height:100vh; }
.wrap{
  max-width:920px; margin:0 auto;
  padding:38px 40px 130px;
}
.page-head{
  padding-bottom:22px; margin-bottom:40px;
  border-bottom:2px solid var(--line);
}
.page-head h1{
  margin:0 0 8px;
  font-size:34px; font-weight:bold; letter-spacing:.04em;
  color:var(--deep);
}
.page-head .sub{
  margin:0;
  font-size:13.5px; letter-spacing:.16em;
  color:var(--muted); text-transform:uppercase;
}
.loading{
  padding:40px 0; color:var(--muted); font-size:15px;
}

.chapter{ margin:0 0 56px; }
.chapter-head{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  padding-bottom:12px; margin-bottom:26px;
  border-bottom:2px solid var(--main);
}
.chapter-head h2{
  margin:0;
  font-size:24px; font-weight:bold; letter-spacing:.03em;
  color:var(--deep);
}
.chapter-meta{
  font-size:12.5px; color:var(--muted); letter-spacing:.08em;
}

.section{
  background:#fff;
  border:1px solid var(--line-soft);
  border-left:4px solid var(--main);
  border-radius:var(--radius);
  padding:22px 28px 20px;
  margin:0 0 22px;
  box-shadow:0 1px 2px rgba(14,107,107,.045);
  scroll-margin-top:22px;
}
.section-head{
  padding-bottom:12px; margin-bottom:14px;
  border-bottom:1px dashed var(--line);
}
.section-head h3{
  position:relative;
  margin:0; padding-left:16px;
  font-size:19px; font-weight:bold;
  color:var(--deep);
}
.section-head h3::before{
  content:"";
  position:absolute; left:0; top:.62em;
  width:8px; height:8px;
  background:var(--main);
  border-radius:2px;
}

/* ---------- 正文排版 ---------- */
.section-body{ color:var(--text); overflow-wrap:break-word; word-break:break-word; }
.section-body > *:first-child{ margin-top:0; }
.section-body > *:last-child{ margin-bottom:0; }
.section-body p{ margin:.72em 0; }
.section-body h4{
  margin:1.25em 0 .45em;
  font-size:16.5px; font-weight:bold;
  color:var(--deep);
}
.section-body h4::before{ content:"◆ "; color:var(--main); font-size:.72em; }
.section-body h5,.section-body h6{
  margin:1.1em 0 .4em; font-size:15.5px; color:var(--main-dark);
}
.section-body ul,.section-body ol{ margin:.62em 0; padding-left:1.65em; }
.section-body li{ margin:.26em 0; }
.section-body li::marker{ color:var(--main); }
.section-body strong{ color:var(--deep); }
.section-body em{ color:var(--main-dark); font-style:italic; }
.section-body a{ color:var(--main-dark); text-decoration-color:var(--line); }
.section-body blockquote{
  margin:1em 0; padding:.6em 1.1em;
  background:var(--pale);
  border-left:3px solid var(--main);
  border-radius:0 8px 8px 0;
  color:var(--text-ans);
}
.section-body blockquote p{ margin:.28em 0; }
.section-body code{
  padding:1px 5px;
  font-family:Consolas,"Courier New","SimSun",monospace;
  font-size:.88em; color:var(--deep);
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:4px;
}
.section-body pre{
  margin:1em 0; padding:12px 14px;
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:8px;
  overflow-x:auto;
}
.section-body pre code{ padding:0; background:none; border:none; }
.section-body hr{ border:none; border-top:1px dashed var(--line); margin:1.5em 0; }
.section-body img{ max-width:100%; height:auto; }

.table-wrap{ margin:1em 0; overflow-x:auto; }
.section-body table{
  border-collapse:collapse; width:100%;
  font-size:15px;
}
.section-body th,.section-body td{
  border:1px solid var(--line-tbl);
  padding:7px 11px; text-align:left;
  vertical-align:middle;
}
.section-body th{ background:var(--pale-2); color:var(--deep); font-weight:bold; }
.section-body tbody tr:nth-child(even) td{ background:#FBFDFD; }

/* ---------- 公式：过长可横向滚动，不撑破版面 ---------- */
.katex{ font-size:1.05em; }
.katex-display{
  margin:1.05em 0;
  padding:6px 2px;
  overflow-x:auto;
  overflow-y:hidden;
}
/* 选择器带 .section-body 前缀，是为了压过 KaTeX 自带样式（它在本文件之后加载），
   min-width:100% 让公式短时居中、长时从最左侧开始，横向滚动时左侧不会被裁掉。 */
.section-body .katex-display > .katex{
  display:inline-block;
  min-width:100%;
  text-align:center;
}
.math-fallback{
  font-family:Consolas,"Courier New",monospace;
  font-size:.9em; color:var(--deep);
  background:var(--panel);
  border:1px dashed var(--line);
  border-radius:6px;
  padding:1px 6px;
}
.math-fallback.block{
  display:block; margin:1em 0; padding:10px 14px;
  overflow-x:auto; white-space:pre;
}
#cdn-warn{
  display:none;
  margin:0 0 26px; padding:12px 16px;
  font-size:14px; color:var(--text-ans);
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--main);
  border-radius:0 8px 8px 0;
}

/* ---------- 页脚 / 返回顶部 ---------- */
.page-foot{
  margin-top:20px; padding-top:20px;
  border-top:1px solid var(--line-soft);
  font-size:13.5px; color:var(--foot);
  letter-spacing:.06em; text-align:center;
}
#toTop{
  position:fixed; right:26px; bottom:26px; z-index:60;
  width:46px; height:46px;
  display:flex; align-items:center; justify-content:center;
  font-family:inherit; font-size:13px; line-height:1.1;
  color:#fff; background:var(--main);
  border:none; border-radius:50%;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(14,107,107,.22);
  opacity:0; pointer-events:none;
  transition:opacity .22s, background .18s, transform .18s;
}
#toTop.show{ opacity:1; pointer-events:auto; }
#toTop:hover{ background:var(--main-dark); transform:translateY(-2px); }

/* ---------- 滚动条美化 ---------- */
.toc-scroll::-webkit-scrollbar,
.katex-display::-webkit-scrollbar,
.table-wrap::-webkit-scrollbar,
.section-body pre::-webkit-scrollbar{ height:6px; width:6px; }
.toc-scroll::-webkit-scrollbar-thumb,
.katex-display::-webkit-scrollbar-thumb,
.table-wrap::-webkit-scrollbar-thumb,
.section-body pre::-webkit-scrollbar-thumb{
  background:var(--line); border-radius:3px;
}
.toc-scroll::-webkit-scrollbar-track{ background:transparent; }

/* ---------- 移动端 ---------- */
@media (max-width:980px){
  #topbar{ display:flex; }
  #sidebar{
    width:300px;
    transform:translateX(-100%);
    transition:transform .28s ease;
    box-shadow:0 0 24px rgba(14,107,107,.16);
    z-index:52;
  }
  #sidebar.open{ transform:translateX(0); }
  main{ margin-left:0; }
  .wrap{ padding:22px 18px 120px; }
  .page-head h1{ font-size:26px; }
  .section{ padding:18px 18px 16px; }
  .section-head h3{ font-size:17.5px; }
  .section{ scroll-margin-top:66px; }
  #toTop{ right:16px; bottom:16px; width:42px; height:42px; font-size:12px; }
}

/* ---------- 打印 ---------- */
@media print{
  #sidebar,#topbar,#toTop,#progress,#overlay{ display:none !important; }
  main{ margin-left:0; }
  .wrap{ max-width:none; padding:0; }
  .section{ break-inside:avoid; box-shadow:none; }
  body{ background:#fff; }
}
</style>
</head>

<body>
<div id="progress"></div>

<!-- 移动端顶栏 -->
<div id="topbar">
  <button id="menuBtn" type="button">目录</button>
  <span id="topbar-title"></span>
</div>
<div id="overlay"></div>

<!-- 左侧目录（自动生成） -->
<aside id="sidebar">
  <div class="side-head">
    <p class="side-title" id="side-title"></p>
    <p class="side-sub" id="side-sub"></p>
  </div>
  <div class="side-search">
    <input id="tocSearch" type="search" placeholder="搜索小节…" autocomplete="off">
  </div>
  <nav class="toc-scroll">
    <div id="toc-list"></div>
    <p id="toc-empty">没有匹配的小节</p>
  </nav>
</aside>

<!-- 右侧正文（自动生成） -->
<main>
  <div class="wrap">
    <header class="page-head">
      <h1 id="page-title"></h1>
      <p class="sub" id="page-sub"></p>
    </header>
    <div id="cdn-warn"></div>
    <div id="notes-root"><p class="loading">正在加载公式与 Markdown 渲染引擎…</p></div>
    <footer class="page-foot" id="page-foot"></footer>
  </div>
</main>

<button id="toTop" type="button">顶部</button>

<script>
/* ==========================================================================
   以下为渲染代码，正常情况下不需要修改。
   逻辑：加载 marked + KaTeX → 遍历 notes → 生成章节/小节/目录 → 绑定交互
   ========================================================================== */
(function () {
  'use strict';

  /* ---------------- 0. 渲染引擎依赖（多个 CDN 依次回退） ---------------- */
  var CDN = {
    katexCss: [
      'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css',
      'https://unpkg.com/katex@0.16.9/dist/katex.min.css',
      'https://lib.baomitu.com/KaTeX/0.16.9/katex.min.css',
      'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css'
    ],
    katexJs: [
      'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js',
      'https://unpkg.com/katex@0.16.9/dist/katex.min.js',
      'https://lib.baomitu.com/KaTeX/0.16.9/katex.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js'
    ],
    markedJs: [
      'https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js',
      'https://unpkg.com/marked@12.0.2/marked.min.js',
      'https://lib.baomitu.com/marked/12.0.2/marked.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js'
    ]
  };

  var state = { katex: false, marked: false };

  // 依次尝试 CDN，全部失败则 reject
  function loadAsset(urls, isCss) {
    return new Promise(function (resolve, reject) {
      var i = 0;
      (function next() {
        if (i >= urls.length) { reject(new Error('asset failed')); return; }
        var url = urls[i++];
        var el;
        if (isCss) {
          el = document.createElement('link');
          el.rel = 'stylesheet';
          el.href = url;
        } else {
          el = document.createElement('script');
          el.src = url;
          el.async = false;
        }
        el.onload = function () { resolve(url); };
        el.onerror = function () {
          if (el.parentNode) { el.parentNode.removeChild(el); }
          next();
        };
        document.head.appendChild(el);
      })();
    });
  }

  function race(promise, ms) {
    return Promise.race([
      promise,
      new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); })
    ]);
  }

  /* ---------------- 1. 基础工具 ---------------- */
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 把源码切成「行」「块」，供 Markdown 兜底解析使用
  function splitLines(src) { return String(src).replace(/\r\n?/g, '\n').split('\n'); }

  /* ---------------- 2. 保护代码块（避免代码里的 $ 被当成公式） ---------------- */
  function protectCode(src, store) {
    // 围栏代码块 ```lang ... ```
    src = src.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, function (_, lang, body) {
      store.push({ lang: String(lang).trim(), body: body });
      return '@@CODE' + (store.length - 1) + '@@';
    });
    // 行内代码 `...`
    src = src.replace(/`([^`\n]+)`/g, function (_, body) {
      store.push({ lang: null, body: body });
      return '@@CODE' + (store.length - 1) + '@@';
    });
    return src;
  }

  /* ---------------- 3. 抽取公式（先抽出来，避免 Markdown 破坏 LaTeX） ---------------- */
  function extractMath(src, store) {
    // 块级 $$ ... $$（允许跨行）
    src = src.replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) {
      store.push({ tex: tex, display: true });
      return '@@MATH' + (store.length - 1) + '@@';
    });
    // 行内 $ ... $（不跨行；前面是反斜杠的 \$ 不触发）
    src = src.replace(/(^|[^\\$])\$([^\n$]+?)\$/g, function (_, pre, tex) {
      store.push({ tex: tex, display: false });
      return pre + '@@MATH' + (store.length - 1) + '@@';
    });
    return src;
  }

  // 渲染单条公式；KaTeX 不可用时降级为原始 LaTeX 文本
  function renderMath(tex, display) {
    if (state.katex && typeof katex !== 'undefined') {
      try {
        return katex.renderToString(tex, {
          displayMode: !!display,
          throwOnError: false,
          strict: false,
          output: 'htmlAndMathml'
        });
      } catch (e) { /* 降级 */ }
    }
    var raw = (display ? '$$' : '$') + String(tex).trim() + (display ? '$$' : '$');
    return display
      ? '<div class="math-fallback block">' + escapeHtml(raw) + '</div>'
      : '<span class="math-fallback">' + escapeHtml(raw) + '</span>';
  }

  /* ---------------- 4. Markdown 兜底解析（CDN 不可用时也能读） ---------------- */
  function miniInline(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  }
  function miniMarkdown(src) {
    var lines = splitLines(src);
    var html = '', listType = null, buf = [];
    function flushP() { if (buf.length) { html += '<p>' + buf.join('<br>') + '</p>'; buf = []; } }
    function closeList() { if (listType) { html += '</' + listType + '>'; listType = null; } }
    lines.forEach(function (raw) {
      var line = raw.trim(), m;
      if (!line) { flushP(); closeList(); return; }
      if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
        flushP(); closeList();
        var lv = Math.min(m[1].length + 2, 6);
        html += '<h' + lv + '>' + miniInline(m[2]) + '</h' + lv + '>';
        return;
      }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) { flushP(); closeList(); html += '<hr>'; return; }
      if ((m = line.match(/^[-*+]\s+(.*)$/))) {
        flushP();
        if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
        html += '<li>' + miniInline(m[1]) + '</li>';
        return;
      }
      if ((m = line.match(/^\d+[.)]\s+(.*)$/))) {
        flushP();
        if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
        html += '<li>' + miniInline(m[1]) + '</li>';
        return;
      }
      if ((m = line.match(/^>\s?(.*)$/))) {
        flushP(); closeList();
        html += '<blockquote><p>' + miniInline(m[1]) + '</p></blockquote>';
        return;
      }
      closeList();
      buf.push(miniInline(line));
    });
    flushP(); closeList();
    return html;
  }

  /* ---------------- 5. 单节内容渲染：Markdown → 公式 → 还原代码 ---------------- */
  function renderContent(src) {
    src = String(src == null ? '' : src);

    var codeStore = [], mathStore = [];
    src = protectCode(src, codeStore);
    src = extractMath(src, mathStore);

    // Markdown 解析
    var html;
    if (state.marked && typeof marked !== 'undefined') {
      try {
        html = String(marked.parse(src, { gfm: true, breaks: true }));
      } catch (e) {
        html = miniMarkdown(src);
      }
    } else {
      html = miniMarkdown(src);
    }

    // 独占一段的块级公式 / 代码块：把外层 <p> 去掉，避免嵌套异常
    html = html.replace(/<p>\s*@@MATH(\d+)@@\s*<\/p>/g, function (_, i) {
      return mathStore[+i] && mathStore[+i].display ? '\n@@MATH' + i + '@@\n' : '<p>@@MATH' + i + '@@</p>';
    });
    html = html.replace(/<p>\s*@@CODE(\d+)@@\s*<\/p>/g, function (_, i) {
      return codeStore[+i] && codeStore[+i].lang !== null ? '\n@@CODE' + i + '@@\n' : '<p>@@CODE' + i + '@@</p>';
    });

    // 公式先还原，代码后还原（顺序反了会让代码里的占位符被误替换）
    html = html.replace(/@@MATH(\d+)@@/g, function (_, i) {
      var it = mathStore[+i];
      return it ? renderMath(it.tex, it.display) : '';
    });
    html = html.replace(/@@CODE(\d+)@@/g, function (_, i) {
      var it = codeStore[+i];
      if (!it) { return ''; }
      if (it.lang === null) { return '<code>' + escapeHtml(it.body) + '</code>'; }
      var cls = it.lang ? ' class="lang-' + escapeHtml(it.lang) + '"' : '';
      return '<pre><code' + cls + '>' + escapeHtml(String(it.body).replace(/\n$/, '')) + '</code></pre>';
    });

    // 表格加一层横向滚动容器
    html = html.replace(/<table>/g, '<div class="table-wrap"><table>')
               .replace(/<\/table>/g, '</table></div>');

    return html;
  }

  /* ---------------- 6. 生成整站内容 + 目录 ---------------- */
  var tocLinks = [], sectionEls = [];

  function buildNotes() {
    var root = document.getElementById('notes-root');
    var tocList = document.getElementById('toc-list');
    var chapters = Array.isArray(notes) ? notes : [];

    var html = [], toc = [], secTotal = 0;

    chapters.forEach(function (ch, ci) {
      var chId = 'ch-' + (ch.id || (ci + 1));
      var secs = Array.isArray(ch.sections) ? ch.sections : [];

      html.push('<section class="chapter" id="' + chId + '">');
      html.push(
        '<div class="chapter-head">' +
          '<h2>' + escapeHtml(ch.chapter) + '</h2>' +
          '<span class="chapter-meta">' + secs.length + ' 节</span>' +
        '</div>'
      );

      toc.push('<div class="toc-ch">');
      toc.push('<a class="toc-ch-link" href="#' + chId + '" data-target="' + chId + '">' + escapeHtml(ch.chapter) + '</a>');
      toc.push('<ul class="toc-secs">');

      secs.forEach(function (sec, si) {
        var sid = 'sec-' + (sec.id || ((ci + 1) + '-' + (si + 1)));
        secTotal++;

        html.push('<article class="section" id="' + sid + '">');
        html.push('<div class="section-head"><h3>' + escapeHtml(sec.title) + '</h3></div>');
        html.push('<div class="section-body">' + renderContent(sec.content) + '</div>');
        html.push('</article>');

        toc.push(
          '<li><a class="toc-sec-link" href="#' + sid + '" data-target="' + sid + '">' +
          escapeHtml(sec.title) + '</a></li>'
        );
      });

      toc.push('</ul></div>');
      html.push('</section>');
    });

    root.innerHTML = html.join('');
    tocList.innerHTML = toc.join('');

    // 缓存节点，供滚动高亮使用
    tocLinks = Array.prototype.slice.call(document.querySelectorAll('#toc-list a[data-target]'));
    sectionEls = Array.prototype.slice.call(document.querySelectorAll('.section, .chapter'));

    // 页脚统计
    var foot = document.getElementById('page-foot');
    foot.textContent = chapters.length + ' 章 · ' + secTotal + ' 节' + (PAGE_FOOTER ? '　|　' + PAGE_FOOTER : '');

    bindTocClicks();
    updateActive();
  }

  /* ---------------- 7. 交互：目录点击 / 高亮 / 返回顶部 / 搜索 ---------------- */
  function bindTocClicks() {
    tocLinks.forEach(function (a) {
      a.addEventListener('click', function (e) {
        var target = a.getAttribute('data-target');
        var el = document.getElementById(target);
        if (!el) { return; }
        e.preventDefault();
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (history.replaceState) { history.replaceState(null, '', '#' + target); }
        setActive(target, true);
        closeSidebar();
      });
    });
  }

  function setActive(id, scrollIntoViewInToc) {
    tocLinks.forEach(function (a) {
      var on = a.getAttribute('data-target') === id;
      a.classList.toggle('active', on);
      if (on && scrollIntoViewInToc && a.scrollIntoView) {
        a.scrollIntoView({ block: 'nearest' });
      }
    });
  }

  function updateActive() {
    if (!sectionEls.length) { return; }
    var offset = window.innerWidth <= 980 ? 96 : 28;
    var current = sectionEls[0].id;
    for (var i = 0; i < sectionEls.length; i++) {
      if (sectionEls[i].getBoundingClientRect().top - offset <= 0) { current = sectionEls[i].id; }
      else { break; }
    }
    // 优先高亮小节（若当前是章节标题，取其后第一个小节）
    var cur = document.getElementById(current);
    if (cur && cur.classList.contains('chapter')) {
      var next = cur.querySelector('.section');
      if (next) { current = next.id; }
    }
    setActive(current, false);
  }

  function onScroll() {
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    var doc = document.documentElement;
    var max = (doc.scrollHeight - window.innerHeight);
    document.getElementById('progress').style.width = (max > 0 ? (y / max) * 100 : 0) + '%';
    document.getElementById('toTop').classList.toggle('show', y > 420);
    updateActive();
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
  }

  function bindUI() {
    document.getElementById('toTop').addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.getElementById('menuBtn').addEventListener('click', function () {
      var open = document.getElementById('sidebar').classList.contains('open');
      open ? closeSidebar() : openSidebar();
    });
    document.getElementById('overlay').addEventListener('click', closeSidebar);

    window.addEventListener('resize', function () {
      if (window.innerWidth > 980) { closeSidebar(); }
    });

    // 目录搜索：过滤左侧小节条目
    var search = document.getElementById('tocSearch');
    search.addEventListener('input', function () {
      var q = search.value.trim().toLowerCase();
      var total = 0;
      Array.prototype.forEach.call(document.querySelectorAll('#toc-list .toc-ch'), function (group) {
        var shown = 0;
        Array.prototype.forEach.call(group.querySelectorAll('li'), function (li) {
          var hit = !q || li.textContent.toLowerCase().indexOf(q) >= 0;
          li.style.display = hit ? '' : 'none';
          if (hit) { shown++; }
        });
        var chHit = !q || group.querySelector('.toc-ch-link').textContent.toLowerCase().indexOf(q) >= 0;
        var show = !q || shown > 0 || chHit;
        group.style.display = show ? '' : 'none';
        total += shown;
      });
      document.getElementById('toc-empty').style.display = (q && total === 0) ? 'block' : 'none';
    });

    window.addEventListener('scroll', function () {
      if (window.requestAnimationFrame) { window.requestAnimationFrame(onScroll); }
      else { onScroll(); }
    }, { passive: true });

    window.addEventListener('hashchange', function () {
      var id = location.hash.replace('#', '');
      if (id && document.getElementById(id)) { setActive(id, true); }
    });
  }

  /* ---------------- 8. 启动 ---------------- */
  function renderAll() {
    // 页头文字
    document.title = PAGE_TITLE;
    document.getElementById('page-title').textContent = PAGE_TITLE;
    document.getElementById('page-sub').textContent = PAGE_SUBTITLE;
    document.getElementById('side-title').textContent = PAGE_TITLE;
    document.getElementById('side-sub').textContent = PAGE_SUBTITLE;
    document.getElementById('topbar-title').textContent = PAGE_TITLE;

    buildNotes();

    // CDN 加载失败提示
    var warn = document.getElementById('cdn-warn');
    if (!state.marked || !state.katex) {
      var miss = [];
      if (!state.marked) { miss.push('Markdown'); }
      if (!state.katex) { miss.push('公式'); }
      warn.innerHTML = '未能加载 ' + miss.join(' 与 ') +
        ' 渲染引擎（可能是当前网络无法访问 CDN）。页面内容仍可阅读，' +
        '公式将显示为原始 LaTeX 代码。联网后刷新页面即可正常渲染。';
      warn.style.display = 'block';
    }

    onScroll();
  }

  function boot() {
    var css = loadAsset(CDN.katexCss, true).catch(function () {});
    var jsKatex = loadAsset(CDN.katexJs, false)
      .then(function () { state.katex = (typeof katex !== 'undefined'); })
      .catch(function () { state.katex = false; });
    var jsMarked = loadAsset(CDN.markedJs, false)
      .then(function () { state.marked = (typeof marked !== 'undefined'); })
      .catch(function () { state.marked = false; });

    var rendered = false;
    function firstRender() {
      if (rendered) { return; }
      rendered = true;
      renderAll();
    }

    // 最多等 5 秒；超时先用降级方案渲染，保证打开即有内容
    setTimeout(firstRender, 5000);

    Promise.all([css, jsKatex, jsMarked]).then(function () {
      if (rendered) {
        // 引擎姗姗来迟：重绘一次，把公式升级为 KaTeX
        if (state.katex || state.marked) { renderAll(); }
      } else {
        firstRender();
      }
    });
  }

  bindUI();
  boot();
})();
</script>
</body>
</html>
